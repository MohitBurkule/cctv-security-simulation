# Far-field variant of `street_crowd`: same crowd and behaviours, but the
# cameras are mounted higher and farther back (10-12 m up, 35-55 m standoff)
# instead of the 3.5-5 m / 14-20 m CCTV-normal mounts in `street_crowd.yaml`.
#
# docs/research/23 §9.2 ("Limitation") notes that `street_crowd`'s people come
# out 60-200 px tall, so the 20-60 px bucket that report 18 says decides which
# detector/tracker/ReID choices actually matter on real low-resolution CCTV is
# empty on that scene. This config exists purely to populate that bucket:
# `tests/test_eval.py::test_street_crowd_far_has_20_60px_bucket` runs it
# through the mock backend and asserts 30-60% of GT box heights land in
# [20, 60] px, from `gt/mot_*.txt` (column 6, MOTChallenge height).
# Measured (seed 7, mock backend, all 3 cameras): 38.6% of 14,888 GT boxes are
# 20-60 px tall (min 12.2, p50 21.7, p90 126.7) — cam_01 stays at street_crowd's
# close mount to keep some >60 px boxes in the mix, cam_02/03 go far enough
# (≈50-70 m standoff) to also populate the <20 px tail, rather than collapsing
# everything into the target bucket.
schema_version: 1
name: street_crowd_far
seed: 7
duration_s: 60
fps: 10
engine: mock

environment:
  id: street_plaza
  zones:
    - {id: zone.gate_A, tag: gate, polygon: [[6, -3], [12, -3], [12, 3], [6, 3]]}
    - {id: zone.yard, tag: public, polygon: [[-16, -16], [16, -16], [16, 16], [-16, 16]]}
  spawn_points:
    - {id: spawn.north, pos: [0.0, 16.0, 0.0]}
    - {id: spawn.east, pos: [16.0, 0.0, 0.0]}
  exits:
    - {id: exit.south, pos: [0.0, -16.0, 0.0]}
    - {id: exit.west, pos: [-16.0, 0.0, 0.0]}

cameras:
  # Same three viewpoints as street_crowd, pulled back to ~35-55 m standoff and
  # raised to a 10-12 m installer-rig mount (docs/03 far-field CCTV envelope).
  - id: cam_01
    type: fixed_bullet
    mount: {pos: [14.0, -10.0, 4.0], yaw: 140, pitch: -20}
    optics: {hfov_deg: 78}
    capture: {res: [1280, 720], fps: 10}
  - id: cam_02
    type: dome
    mount: {pos: [-48.0, 32.0, 12.0], yaw: -35, pitch: -10}
    optics: {hfov_deg: 95}
    capture: {res: [1280, 720], fps: 10}
  - id: cam_03
    type: fixed_bullet
    mount: {pos: [-48.0, -48.0, 13.0], yaw: 45, pitch: -9}
    optics: {hfov_deg: 70}
    capture: {res: [1280, 720], fps: 10}

population:
  hero:
    - id: loiterer_1
      role: intruder
      body: {height_m: 1.8, skin_tone: 3, sex_presentation: m, age_band: 25-40}
      gait: {style: normal, speed_mps: 1.3}
      intent:
        - {type: transit, from: spawn.east, to: zone.gate_A}
        - {type: loiter, zone: zone.gate_A, dur_s: 25, activity: pace, radius_m: 2.5}
        - {type: transit, to: exit.west}
    - id: commuter_1
      role: commuter
      hard_negative_for: [loiter]
      body: {height_m: 1.65, skin_tone: 7, sex_presentation: f, age_band: 25-40}
      gait: {style: normal, speed_mps: 1.2}
      intent:
        - {type: transit, from: spawn.north, to: zone.gate_A}
        - {type: commute_wait, zone: zone.gate_A, dur_s: 25, activity: idle}
        - {type: transit, to: exit.south}
  generators:
    - {template: passer_by, count: 12, zones: [zone.yard]}
    - {template: commute_wait_negative, count: 3, zones: [zone.gate_A], dur_s: [20, 40]}
    - {template: loiterer, count: 1, zones: [zone.gate_A], dur_s: [30, 50]}

output:
  modalities: [rgb]
  gt: [mot, events, world_parquet, calib, identities]
