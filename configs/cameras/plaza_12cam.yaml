cameras:
  - id: cam_01
    type: fixed_bullet
    mount: {pos: [12.3, -8.0, 4.2], yaw: 135, pitch: -22, roll: 0}
    optics: {hfov_deg: 78, distortion: {model: brown, k1: -0.21, k2: 0.04}, rolling_shutter_ms: 12}
    capture: {res: [1920, 1080], fps: 25, exposure: auto, night_mode: auto_ir}
    stream: {codec: h264, bitrate_kbps: 2500, gop: 50, clock_offset_ms: 180, drift_ppm: 30, packet_loss: 0.002}
    degrade: {lens_dirt: 0.1, vignetting: 0.2}
    overlay: {timestamp: true, name: "CAM01 GATE A"}
  - id: cam_02
    type: dome
    mount: {pos: [-15.0, 20.0, 3.6], yaw: -40, pitch: -30}
    optics: {hfov_deg: 95}
    capture: {res: [1280, 720], fps: 15}
    stream: {codec: h264, bitrate_kbps: 1200, clock_offset_ms: -90}
  - id: cam_07
    type: ptz
    mount: {pos: [0.0, 0.0, 9.0], yaw: 0, pitch: -15}
    optics: {hfov_deg: [2.3, 60]}
    capture: {res: [1920, 1080], fps: 25}
    ptz: {pan: [-170, 170], tilt: [-90, 10], speed_dps: 60,
          patrol: [{preset: gate_B, dwell_s: 20}, {preset: stage, dwell_s: 15}], auto_track: false}
    presets: {gate_B: {yaw: 60, pitch: -25, hfov_deg: 20}, stage: {yaw: -110, pitch: -18, hfov_deg: 35}}
  - id: cam_11
    type: fisheye
    mount: {pos: [5.0, 5.0, 6.0], yaw: 0, pitch: -90}
    optics: {model: kannala_brandt, fov_deg: 180}
    capture: {res: [2048, 2048], fps: 12}
  # cam_03..cam_06, cam_08..cam_10, cam_12: generated by rig_tools.auto_place
rig_tools:
  auto_place: {n_extra: 8, mounts_from: props.camera_mount, objective: coverage_of_zones,
               weights: {restricted: 3, gate: 2, public: 1}, min_px_height_at_zone_m: 60}
